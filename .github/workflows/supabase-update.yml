# Supabase automatisch aktualisieren, sobald Änderungen in main landen (z. B. nach dem Merge eines Pull Requests).
#   1. Datenbank: supabase/budget.sql ausführen (wiederholbar, löscht keine Daten), als ein Block: bei einem Fehler wird nichts geändert.
#   2. KI-Funktion: supabase/functions/ai neu deployen.
# Einrichtung (einmalig): anleitung/automatik-setup.md. Fehlen die Secrets, wird der jeweilige Schritt nur übersprungen.
name: Supabase aktualisieren

on:
  push:
    branches: [main]
    paths:
      - 'supabase/budget.sql'
      - 'supabase/functions/ai/**'
      - '.github/workflows/supabase-update.yml'
  workflow_dispatch: # „Run workflow“ im Tab Actions: alles einmal von Hand ausführen

# Nie zwei Läufe gleichzeitig (sonst könnten sich zwei Datenbank-Updates überholen)
concurrency:
  group: supabase-update-v2 # neuer Name: neue Läufe warten nicht auf einen alten, hängenden Lauf
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ixynvpdkgzukqrqzdtwo # aus config.js (https://<ref>.supabase.co)

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.diff.outputs.db }}
      ai: ${{ steps.diff.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        name: Was hat sich geändert?
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git rev-parse -q --verify HEAD~1 >/dev/null; then
            echo "db=true" >> "$GITHUB_OUTPUT"; echo "ai=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Bei einem Merge mehrere Commits: gegen den Stand vor dem Push vergleichen
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            git fetch -q --depth=50 origin "${{ github.ref }}" || true
            git cat-file -e "$BASE" 2>/dev/null || BASE=HEAD~1
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "$CHANGED"
          echo "db=$(echo "$CHANGED" | grep -qE '^(supabase/budget\.sql|\.github/workflows/supabase-update\.yml)$' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ai=$(echo "$CHANGED" | grep -qE '^(supabase/functions/ai/|\.github/workflows/supabase-update\.yml$)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  database:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # nie wieder stundenlang hängen
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '20' # Verbindungsaufbau höchstens 20 s
      PGAPPNAME: github-supabase-update
    steps:
      - uses: actions/checkout@v4
      - name: Secret vorhanden?
        id: check
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice title=Datenbank nicht aktualisiert::Secret SUPABASE_DB_URL fehlt. Einrichtung: anleitung/automatik-setup.md. Bis dahin supabase/budget.sql von Hand im SQL Editor ausführen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: psql bereitstellen
        if: steps.check.outputs.ok == 'true'
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - name: Verbindung testen
        if: steps.check.outputs.ok == 'true'
        run: |
          # Grobe Prüfung der Adresse, ohne sie auszugeben
          case "$SUPABASE_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error title=SUPABASE_DB_URL ungültig::Die Adresse muss mit postgresql:// beginnen (Supabase → Connect → Session pooler → URI)."; exit 1 ;;
          esac
          if echo "$SUPABASE_DB_URL" | grep -q 'YOUR-PASSWORD'; then
            echo "::error title=Passwort fehlt::In SUPABASE_DB_URL steht noch [YOUR-PASSWORD]. Durch das Datenbank-Passwort ersetzen."; exit 1
          fi
          if ! echo "$SUPABASE_DB_URL" | grep -qE '^postgres(ql)?://[^:/@]+:[^@]+@'; then
            echo "::error title=Passwort fehlt::In SUPABASE_DB_URL fehlt das Passwort (Form: postgresql://BENUTZER:PASSWORT@HOST:5432/postgres)."; exit 1
          fi
          # -w: nie nach einem Passwort fragen (sonst wartet psql ewig auf eine Eingabe); </dev/null: keine Eingabe möglich
          if ! timeout 60 psql "$SUPABASE_DB_URL" -w --no-psqlrc -v ON_ERROR_STOP=1 -tA -c "select 'Verbindung ok: ' || current_user" </dev/null; then
            echo "::error title=Keine Verbindung zur Datenbank::Adresse in SUPABASE_DB_URL prüfen: „Session pooler“ (Port 5432) verwenden, nicht „Direct connection“, und das Passwort muss stimmen. Siehe anleitung/automatik-setup.md."
            exit 1
          fi
      - name: budget.sql ausführen (alles oder nichts)
        if: steps.check.outputs.ok == 'true'
        # lock_timeout: Hält eine andere Verbindung (z. B. eine offene Abfrage im SQL Editor) eine Tabelle fest, nach 30 s abbrechen statt ewig zu warten.
        run: |
          if ! timeout 300 psql "$SUPABASE_DB_URL" -w --no-psqlrc -v ON_ERROR_STOP=1 --single-transaction -q \
               -c "set lock_timeout = '30s'" -c "set statement_timeout = '4min'" -f supabase/budget.sql </dev/null; then
            echo "::error title=budget.sql nicht ausgeführt::Es wurde nichts geändert (alles oder nichts). Bei „lock timeout“: offene Abfragen im Supabase SQL Editor schließen und „Run workflow“ erneut starten. Sonst die Fehlermeldung oben weitergeben."
            exit 1
          fi
      - name: Ergebnis
        if: steps.check.outputs.ok == 'true'
        run: echo "::notice title=Datenbank aktualisiert::supabase/budget.sql wurde ausgeführt."

  ai-function:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Secret vorhanden?
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice title=KI-Funktion nicht deployt::Secret SUPABASE_ACCESS_TOKEN fehlt. Einrichtung: anleitung/automatik-setup.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with:
          version: 3.4.0 # fest, damit eine neue CLI-Version die Befehle nicht unbemerkt ändert (v3: --remote statt --project-ref)
      - name: Funktion ai deployen
        if: steps.check.outputs.ok == 'true'
        # --use-api: Supabase baut die Funktion selbst (kein Docker nötig); --yes: Bestätigung für Änderungen am Live-Projekt.
        # Die Secrets der Funktion (CF_ACCOUNT_ID usw.) und „Verify JWT“ (Standard: an) bleiben unverändert.
        run: supabase functions deploy ai --remote="$SUPABASE_PROJECT_REF" --use-api --yes
      - name: Ergebnis
        if: steps.check.outputs.ok == 'true'
        run: echo "::notice title=KI-Funktion deployt::supabase/functions/ai ist live."
